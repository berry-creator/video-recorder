<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Recorder Console</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111315;
      color: #e8eaed;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: #111315; }
    button, input, select { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    header {
      min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 18px;
      padding: 0 24px; border-bottom: 1px solid #303439; background: #17191c;
    }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 650; }
    .brand-name { white-space: nowrap; }
    .brand-divider { width: 1px; height: 18px; background: #3a3f45; }
    h1 { margin: 0; color: #b8bec6; font-size: 14px; font-weight: 560; letter-spacing: 0; white-space: nowrap; }
    .mark { width: 24px; height: 18px; border: 2px solid #e8eaed; border-radius: 4px; position: relative; }
    .mark::after { content: ""; position: absolute; right: -7px; top: 4px; border: 4px solid transparent; border-right: 0; border-left: 6px solid #e8eaed; }
    .header-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
    .header-button { min-height: 32px; padding: 0 10px; font-size: 12px; white-space: nowrap; }
    .language-select { width: auto; min-width: 92px; height: 32px; margin: 0; padding: 0 28px 0 9px; font-size: 12px; }
    .service-state { display: flex; align-items: center; gap: 8px; color: #aeb4bc; font-size: 13px; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d45252; }
    .dot.online { background: #42b883; box-shadow: 0 0 0 3px rgb(66 184 131 / 14%); }
    main { width: min(1240px, 100%); margin: 0 auto; padding: 16px 24px 32px; }
    button { min-height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid #42474e; background: #24272b; color: #f1f3f4; }
    button:hover { background: #2c3035; }
    button.primary { border-color: #267c5a; background: #267c5a; }
    button.primary:hover { background: #2d9169; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, .75fr); align-items: stretch; gap: 16px; }
    .panel { border: 1px solid #303439; border-radius: 8px; background: #191c1f; overflow: hidden; }
    .preview-panel { display: flex; flex-direction: column; }
    .panel-title { min-height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #303439; }
    .panel-title h2 { margin: 0; font-size: 14px; font-weight: 620; letter-spacing: 0; }
    .config-title-copy { min-width: 0; display: flex; align-items: baseline; gap: 9px; }
    .config-title-copy .muted { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .panel-title-actions { flex: 0 0 auto; display: flex; gap: 6px; margin-left: 10px; }
    .panel-title-actions button { min-height: 30px; padding: 0 10px; font-size: 12px; }
    .reset-marker { margin-right: 3px; color: #ef5f5f; font-weight: 750; }
    .muted { color: #9299a2; font-size: 12px; }
    .preview { position: relative; flex: 1 1 auto; width: 100%; min-height: 0; aspect-ratio: 16 / 9; background: #090a0b; }
    canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
    .empty { position: absolute; inset: 0; display: grid; place-items: center; color: #7f8790; font-size: 13px; pointer-events: none; }
    .empty[hidden] { display: none; }
    label[hidden], input[hidden] { display: none; }
    .metrics { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid #303439; }
    .metric { min-width: 0; padding: 12px 14px; border-right: 1px solid #303439; }
    .metric:last-child { border-right: 0; }
    .metric-label { color: #8f969f; font-size: 11px; margin-bottom: 4px; }
    .metric-value { font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    form { padding: 15px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label, .field { display: block; min-width: 0; color: #aeb4bc; font-size: 12px; }
    label.wide, .field.wide { grid-column: 1 / -1; }
    .field-help { display: block; min-height: 15px; margin-top: 5px; color: #9299a2; font-size: 11px; }
    .field-help.warning { color: #e6bf68; }
    .field-help.error { color: #ef8585; }
    input, select { width: 100%; height: 36px; margin-top: 6px; padding: 0 10px; border: 1px solid #3b4046; border-radius: 5px; outline: 0; background: #121416; color: #eef0f2; }
    .checkbox-field { min-height: 55px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .checkbox-field input[type="checkbox"] { width: 18px; height: 18px; margin: 0; padding: 0; accent-color: #42b883; }
    input:focus, select:focus { border-color: #4f86c6; box-shadow: 0 0 0 2px rgb(79 134 198 / 15%); }
    .control-with-action { display: grid; grid-template-columns: minmax(0, 1fr) 36px; gap: 7px; margin-top: 6px; }
    .control-with-action input, .control-with-action select { margin-top: 0; }
    input[readonly] { color: #c8cdd3; cursor: default; }
    .icon-button { width: 36px; min-height: 36px; padding: 0; font-size: 20px; line-height: 1; }
    .export-band { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 16px; padding: 15px; border: 1px solid #303439; border-radius: 8px; background: #191c1f; }
    .export-band input { margin: 0; }
    .export-actions { display: flex; gap: 8px; }
    .export-actions button { min-width: 84px; white-space: nowrap; }
    .notice { min-height: 20px; grid-column: 1 / -1; color: #9ca3ab; font-size: 12px; }
    .notice.error { color: #ef8585; }
    .notice.warning { color: #e6bf68; }
    .notice.success { color: #65c99b; }
    @media (max-width: 820px) {
      header { padding: 0 16px; }
      main { padding: 14px 16px 26px; }
      .layout { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: 1fr 1fr; }
      .metric { border-bottom: 1px solid #303439; }
      .metric:nth-child(even) { border-right: 0; }
      .metric:nth-last-child(-n + 2) { border-bottom: 0; }
    }
    @media (max-width: 700px) {
      header { padding: 10px 16px; flex-wrap: wrap; }
      .header-actions { width: 100%; }
    }
    @media (max-width: 520px) {
      .header-actions { gap: 9px; }
      .language-select { min-width: 82px; }
      .fields { grid-template-columns: 1fr; }
      label.wide, .field.wide { grid-column: auto; }
      .metrics { grid-template-columns: 1fr; }
      .metric, .metric:nth-child(even) { border-right: 0; }
      .metric:nth-last-child(-n + 2) { border-bottom: 1px solid #303439; }
      .metric:last-child { border-bottom: 0; }
      .export-band { grid-template-columns: 1fr; }
      .export-actions { width: 100%; }
      .export-actions button { flex: 1 1 0; min-width: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true"></span><span class="brand-name">Video Recorder</span><span class="brand-divider" aria-hidden="true"></span><h1 data-i18n="consoleTitle">录像控制台</h1></div>
    <div class="header-actions">
      <button id="refreshButton" class="header-button" type="button" data-i18n="refreshStatus">刷新状态</button>
      <select id="languageSelect" class="language-select" aria-label="界面语言" data-i18n-aria="languageLabel">
        <option value="auto" data-i18n="languageAuto">自动</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
      <div class="service-state"><span id="serviceDot" class="dot"></span><span id="serviceText" data-i18n="connecting">正在连接</span></div>
    </div>
  </header>
  <main>
    <div class="layout">
      <section class="panel preview-panel">
        <div class="panel-title"><h2 data-i18n="livePreview">实时预览</h2><span id="previewMeta" class="muted" data-i18n="waitingStream">等待视频流</span></div>
        <div class="preview">
          <canvas id="previewCanvas"></canvas>
          <div id="previewEmpty" class="empty" data-i18n="noFrame">暂无画面</div>
        </div>
        <div class="metrics">
          <div class="metric"><div class="metric-label" data-i18n="captureStatus">状态</div><div id="captureState" class="metric-value">--</div></div>
          <div class="metric"><div class="metric-label" data-i18n="capturedDuration">已录制时间</div><div id="capturedDuration" class="metric-value">--</div></div>
          <div class="metric"><div class="metric-label" data-i18n="bufferedFrames">已录制帧数</div><div id="bufferFrames" class="metric-value">--</div></div>
          <div class="metric"><div class="metric-label" data-i18n="memoryUsage">内存缓冲</div><div id="bufferBytes" class="metric-value">--</div></div>
          <div class="metric"><div class="metric-label" data-i18n="previewConnections">预览连接</div><div id="viewers" class="metric-value">--</div></div>
          <div class="metric"><div class="metric-label" data-i18n="transcodeStatus">实时转码</div><div id="transcodeState" class="metric-value">--</div></div>
        </div>
      </section>
      <section class="panel">
        <div class="panel-title">
          <div class="config-title-copy"><h2 data-i18n="captureConfig">配置</h2><span class="muted" data-i18n="configRestartHint">硬件参数变化时重新连接摄像头</span></div>
          <div class="panel-title-actions">
            <button id="resetConfigButton" type="button"><span class="reset-marker" aria-hidden="true" title="此项会恢复默认值" data-i18n-title="resetMarkerHint">*</span><span data-i18n="resetConfig">重置</span></button>
            <button id="saveConfigButton" class="primary" type="submit" form="configForm" data-i18n="saveConfig">保存</button>
          </div>
        </div>
        <form id="configForm">
          <div class="fields">
            <label><span data-i18n="videoSource">视频源</span><select id="source"><option value="mock" data-i18n="mockSource">测试画面</option><option value="camera" data-i18n="cameraSource">摄像头</option></select></label>
            <label><span class="reset-marker" aria-hidden="true" title="此项会恢复默认值" data-i18n-title="resetMarkerHint">*</span><span data-i18n="frameRate">帧率</span><input id="fps" type="number" min="1" max="120" list="fpsOptions" required><datalist id="fpsOptions"></datalist></label>
            <div class="field wide">
              <label for="device" data-i18n="cameraDevice">摄像头设备</label>
              <div class="control-with-action">
                <select id="device"><option value="" data-i18n="detectingCameras">正在检测摄像头</option></select>
                <button id="refreshCamerasButton" class="icon-button" type="button" title="重新检测摄像头" aria-label="重新检测摄像头" data-i18n-title="refreshCameras" data-i18n-aria="refreshCameras">↻</button>
              </div>
            </div>
            <label class="wide"><span data-i18n="cameraMode">硬件模式</span><select id="cameraMode"><option value="" data-i18n="manualMode">手工设置</option></select><span id="cameraCapabilityMeta" class="field-help"></span></label>
            <label id="pixelFormatField"><span data-i18n="pixelFormat">输入像素格式</span><select id="pixelFormatSelect"><option value="" data-i18n="automaticFormat">自动检测</option><option value="__manual__" data-i18n="manualMode">手工设置</option></select><input id="pixelFormat" type="text" autocomplete="off" data-i18n-placeholder="manualPixelFormat" hidden></label>
            <label id="videoCodecField"><span data-i18n="videoCodec">输入视频编码</span><input id="videoCodec" type="text" list="videoCodecOptions" autocomplete="off"><datalist id="videoCodecOptions"></datalist></label>
            <label><span class="reset-marker" aria-hidden="true" title="此项会恢复默认值" data-i18n-title="resetMarkerHint">*</span><span data-i18n="width">宽度</span><input id="width" type="number" min="160" max="7680" list="widthOptions" required><datalist id="widthOptions"></datalist></label>
            <label><span class="reset-marker" aria-hidden="true" title="此项会恢复默认值" data-i18n-title="resetMarkerHint">*</span><span data-i18n="height">高度</span><input id="height" type="number" min="120" max="4320" list="heightOptions" required><datalist id="heightOptions"></datalist></label>
            <label><span class="reset-marker" aria-hidden="true" title="此项会恢复默认值" data-i18n-title="resetMarkerHint">*</span><span data-i18n="bufferDuration">内存缓冲时长（秒）</span><input id="bufferSeconds" type="number" min="1" max="3600" required></label>
            <label><span class="reset-marker" aria-hidden="true" title="此项会恢复默认值" data-i18n-title="resetMarkerHint">*</span><span data-i18n="jpegQuality">JPEG 质量（2 最佳）</span><input id="jpegQuality" type="number" min="2" max="31" required></label>
            <label><span data-i18n="maxRecordingDuration">最长录制时长（分钟）</span><input id="maxRecordingMinutes" type="number" min="1" max="10080" required></label>
            <label class="checkbox-field"><span data-i18n="liveTranscode">录制期间转码</span><input id="transcodeDuringRecording" type="checkbox"></label>
            <label><span data-i18n="exportEncoder">H.264 编码器</span><select id="exportEncoder"><option value="auto" data-i18n="encoderAuto">自动</option><option value="software" data-i18n="encoderSoftware">软件</option></select></label>
            <label><span data-i18n="softwareThreads">软件编码线程数</span><input id="softwareThreads" type="number" min="1" max="16" required></label>
            <label><span data-i18n="serverPort">服务端口</span><input id="serverPort" type="number" min="1" max="65535" required></label>
            <label><span data-i18n="storageOrganization">文件分类</span><select id="storageOrganization"><option value="day" data-i18n="organizationDay">按天</option><option value="month" data-i18n="organizationMonth">按月</option><option value="none" data-i18n="organizationNone">无</option></select></label>
            <div class="field wide">
              <label for="directory" data-i18n="storageDirectory">视频存储目录</label>
              <div class="control-with-action">
                <input id="directory" type="text" readonly required>
                <button id="selectDirectoryButton" class="icon-button" type="button" title="选择视频存储目录" aria-label="选择视频存储目录" data-i18n-title="selectDirectory" data-i18n-aria="selectDirectory">📁</button>
              </div>
            </div>
            <label class="wide"><span data-i18n="allowedOrigins">允许的 Web 应用 Origin</span><input id="allowedOrigins" type="text" placeholder="例如 https://app.example.com，多个地址用逗号分隔" data-i18n-placeholder="originsPlaceholder"></label>
          </div>
        </form>
      </section>
    </div>
    <section class="export-band">
      <input id="fileName" type="text" maxlength="128" placeholder="导出文件名，例如 task_20260728_001" aria-label="导出文件名" data-i18n-placeholder="filePlaceholder" data-i18n-aria="fileLabel">
      <div class="export-actions"><button id="exportButton" class="primary" type="button" data-i18n="exportBuffer" disabled>保存</button><button id="resetCaptureButton" type="button" data-i18n="resetCapture" disabled>新的录制</button></div>
      <div id="notice" class="notice"></div>
    </section>
  </main>

        cameraDetectionFailed: 'Camera detection failed: {message}', directorySelectionFailed: 'Directory selection failed: {message}',
        taskAccepted: 'Save queued; live preview continues: {fileName}', exportComplete: 'Save completed: {fileName}', exportFailed: 'Save failed',
        exportProgress: 'Saving {fileName} ({frameCount} frames)', transcodeDisabled: 'Disabled', transcodeStarting: 'Starting', transcodeRunning: '{encoder} · {speed}x', transcodeFinalizing: 'Finalizing', transcodeCompleted: 'Completed · {encoder}', transcodeFallback: 'Encode on save'
      }
    };

    function detectedLanguage() {
      const preferred = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
      return preferred.toLowerCase().startsWith('zh') ? 'zh' : 'en';
    }

    function storedLanguagePreference() {
      try {
        const stored = localStorage.getItem('videoRecorderLanguage');
        return stored === 'zh' || stored === 'en' ? stored : 'auto';
      } catch (_) {
        return 'auto';
      }
    }

    let languagePreference = storedLanguagePreference();
    let language = languagePreference === 'auto' ? detectedLanguage() : languagePreference;

    function t(key, values = {}) {
      const template = messages[language][key] || messages.en[key] || key;
      return template.replace(/\{(\w+)\}/g, (_, name) => values[name] ?? `{${name}}`);
    }

    function applyLanguage(preference, persist = false) {
      languagePreference = preference === 'zh' || preference === 'en' ? preference : 'auto';
      language = languagePreference === 'auto' ? detectedLanguage() : languagePreference;
      document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
      document.title = t('pageTitle');
      document.querySelectorAll('[data-i18n]').forEach((element) => {
        element.textContent = t(element.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach((element) => {
        element.placeholder = t(element.dataset.i18nPlaceholder);
      });
      document.querySelectorAll('[data-i18n-aria]').forEach((element) => {
        element.setAttribute('aria-label', t(element.dataset.i18nAria));
      });
      document.querySelectorAll('[data-i18n-title]').forEach((element) => {
        element.title = t(element.dataset.i18nTitle);
      });
      $('languageSelect').value = languagePreference;
      if (persist) {
        try {
          if (languagePreference === 'auto') localStorage.removeItem('videoRecorderLanguage');
          else localStorage.setItem('videoRecorderLanguage', languagePreference);
        } catch (_) {}
      }
    }

    applyLanguage(languagePreference);

    const canvas = $('previewCanvas');
    const context = canvas.getContext('2d');
    let config;
    let socket;
    let reconnectTimer;
    let camerasLoading = false;
    let capabilitiesLoading = false;
    let capabilityRequest = 0;
    let lastCaptureWarning = '';
    let currentState = 'reconnecting';
    let currentRecordingState = 'previewing';
    let cameraModes = [];
    let detectedPixelFormats = [];
    let cameraPlatform = '';

    async function api(path, options = {}) {
      const response = await fetch(path, options);
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.message || t('requestFailed'));
      return payload;
    }

    function showNotice(message, type = '') {
      $('notice').textContent = message;
      $('notice').className = `notice ${type}`;
    }

    function bytes(value) {
      if (value < 1024) return `${value} B`;
      if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KB`;
      return `${(value / 1024 / 1024).toFixed(1)} MB`;
    }

    function friendlyDuration(milliseconds) {
      let seconds = Math.max(0, Math.floor(milliseconds / 1000));
      if (milliseconds > 0 && seconds === 0) return language === 'zh' ? '不足 1 秒' : 'Less than 1 sec';
      const days = Math.floor(seconds / 86400);
      seconds %= 86400;
      const hours = Math.floor(seconds / 3600);
      seconds %= 3600;
      const minutes = Math.floor(seconds / 60);
      seconds %= 60;
      if (language === 'zh') {
        if (days) return `${days}天 ${hours}小时 ${minutes}分`;
        if (hours) return `${hours}小时 ${minutes}分 ${seconds}秒`;
        if (minutes) return `${minutes}分 ${seconds}秒`;
        return `${seconds}秒`;
      }
      if (days) return `${days}d ${hours}h ${minutes}m`;
      if (hours) return `${hours}h ${minutes}m ${seconds}s`;
      if (minutes) return `${minutes}m ${seconds}s`;
      return `${seconds}s`;
    }

    function configuredPort(address) {
      const match = String(address).match(/:(\d+)$/);
      return match ? Number(match[1]) : 8800;
    }

    function addressWithPort(address, port) {
      return String(address).replace(/:\d+$/, `:${port}`);
    }

    async function loadConfig() {
      const payload = await api('/api/v1/config');
      config = payload.data;
      $('source').value = config.capture.source;
      detectedPixelFormats = [];
      setPixelFormatValue(config.capture.pixelFormat || '');
      $('videoCodec').value = config.capture.videoCodec || '';
      $('width').value = config.capture.width;
      $('height').value = config.capture.height;
      $('fps').value = config.capture.fps;
      $('bufferSeconds').value = config.capture.bufferSeconds;
      $('serverPort').value = configuredPort(config.server.address);
      $('jpegQuality').value = config.capture.jpegQuality;
      $('maxRecordingMinutes').value = config.recording.maxDurationMinutes;
      $('transcodeDuringRecording').checked = Boolean(config.export.transcodeDuringRecording);
      $('exportEncoder').value = config.export.encoder || 'auto';
      $('softwareThreads').value = config.export.softwareThreads || 2;
      $('directory').value = config.storage.directory;
      $('storageOrganization').value = config.storage.organization;
      $('allowedOrigins').value = config.server.allowedOrigins.join(', ');
      await loadCameras(false);
    }

    function setConfigButtonsDisabled(disabled) {
      $('saveConfigButton').disabled = disabled;
      $('resetConfigButton').disabled = disabled;
    }

    async function resetConfig() {
      if (!window.confirm(t('resetConfigConfirm'))) return;
      setConfigButtonsDisabled(true);
      try {
        const payload = await api('/api/v1/config/reset', {method: 'POST'});
        config = payload.data;
        await Promise.all([loadConfig(), loadStatus()]);
        showNotice(t('configReset'), 'success');
      } catch (error) {
        showNotice(t('configResetFailed', {message: error.message}), 'error');
      } finally {
        setConfigButtonsDisabled(false);
      }
    }

    function setDatalist(id, values) {
      const unique = [...new Set(values.filter((value) => value !== '' && value !== 0))];
      $(id).replaceChildren(...unique.map((value) => new Option(String(value))));
    }

    function pixelFormatValue() {
      return $('pixelFormatSelect').value === '__manual__' ? $('pixelFormat').value.trim() : $('pixelFormatSelect').value;
    }

    function setPixelFormatValue(value) {
      value = String(value || '').trim();
      const options = [new Option(t('automaticFormat'), '')];
      detectedPixelFormats.forEach((format) => options.push(new Option(format, format)));
      options.push(new Option(t('manualMode'), '__manual__'));
      $('pixelFormatSelect').replaceChildren(...options);
      if (value && detectedPixelFormats.includes(value)) {
        $('pixelFormatSelect').value = value;
      } else if (value) {
        $('pixelFormatSelect').value = '__manual__';
        $('pixelFormat').value = value;
      } else {
        $('pixelFormatSelect').value = '';
        $('pixelFormat').value = '';
      }
      $('pixelFormat').hidden = $('pixelFormatSelect').value !== '__manual__';
    }

    function updateCameraInputFields() {
      const camera = $('source').value === 'camera';
      const codecSupported = !cameraPlatform || cameraPlatform === 'windows';
      $('videoCodecField').hidden = camera && !codecSupported;
      $('videoCodec').disabled = !camera || !codecSupported;
      $('pixelFormatSelect').disabled = !camera || capabilitiesLoading;
      $('pixelFormat').disabled = !camera || capabilitiesLoading || $('pixelFormatSelect').value !== '__manual__';
    }

    function setCapabilityMeta(message = '', type = '') {
      const meta = $('cameraCapabilityMeta');
      meta.textContent = message;
      meta.className = `field-help ${type}`;
    }

    function modeMatchesInputs(mode) {
      return (mode.pixelFormat || '') === pixelFormatValue() &&
        (mode.videoCodec || '') === $('videoCodec').value.trim() &&
        Number(mode.width) === Number($('width').value) &&
        Number(mode.height) === Number($('height').value) &&
        Number(mode.fps) === Number($('fps').value);
    }

    function cameraModeLabel(mode) {
      const input = mode.videoCodec ? `${t('codecMode')}: ${mode.videoCodec}` : `${t('pixelMode')}: ${mode.pixelFormat}`;
      return `${input} · ${mode.width} × ${mode.height} · ${mode.fps} FPS`;
    }

    function syncCameraModeSelection() {
      const index = cameraModes.findIndex(modeMatchesInputs);
      $('cameraMode').value = index >= 0 ? String(index) : '';
    }

    function applyCameraMode(mode) {
      if (!mode) return;
      setPixelFormatValue(mode.pixelFormat || '');
      $('videoCodec').value = mode.videoCodec || '';
      if (mode.width) $('width').value = mode.width;
      if (mode.height) $('height').value = mode.height;
      if (mode.fps) $('fps').value = mode.fps;
    }

    function updateModeDatalists() {
      const selectedPixelFormat = pixelFormatValue();
      const selectedVideoCodec = $('videoCodec').value.trim();
      const matchingModes = cameraModes.filter((mode) =>
        (!selectedPixelFormat && !selectedVideoCodec) ||
        (selectedPixelFormat && mode.pixelFormat === selectedPixelFormat) ||
        (selectedVideoCodec && mode.videoCodec === selectedVideoCodec));
      setDatalist('widthOptions', matchingModes.map((mode) => mode.width));
      setDatalist('heightOptions', matchingModes.map((mode) => mode.height));
      setDatalist('fpsOptions', matchingModes.map((mode) => mode.fps));
    }

    function renderCameraModes() {
      const options = [new Option(t('manualMode'), '')];
      cameraModes.forEach((mode, index) => options.push(new Option(cameraModeLabel(mode), String(index))));
      $('cameraMode').replaceChildren(...options);
      syncCameraModeSelection();
    }

    async function loadCameraCapabilities(applyRecommended = false, preserveInput = false, allowRetry = true) {
      const device = $('device').value;
      if ($('source').value !== 'camera' || !device) {
        cameraModes = [];
        detectedPixelFormats = [];
        cameraPlatform = '';
        setPixelFormatValue(pixelFormatValue());
        renderCameraModes();
        setDatalist('videoCodecOptions', []);
        setDatalist('widthOptions', []);
        setDatalist('heightOptions', []);
        setDatalist('fpsOptions', []);
        setCapabilityMeta();
        updateCameraInputFields();
        return;
      }
      const request = ++capabilityRequest;
      const requestedPixelFormat = pixelFormatValue();
      const requestedVideoCodec = $('videoCodec').value.trim();
      capabilitiesLoading = true;
      updateDeviceState();
      setCapabilityMeta(t('detectingCapabilities'));
      try {
        const query = new URLSearchParams({device});
        if (preserveInput && requestedPixelFormat) query.set('pixelFormat', requestedPixelFormat);
        if (preserveInput && requestedVideoCodec) query.set('videoCodec', requestedVideoCodec);
        const payload = await api(`/api/v1/cameras/capabilities?${query}`);
        if (request !== capabilityRequest) return;
        const data = payload.data || {};
        const formats = Array.isArray(data.pixelFormats) ? data.pixelFormats : [];
        const codecs = Array.isArray(data.videoCodecs) ? data.videoCodecs : [];
        const modes = Array.isArray(data.modes) ? data.modes : [];
        const recommended = data.recommended || {};
        cameraPlatform = data.platform || cameraPlatform;
        detectedPixelFormats = [...new Set(formats.filter(Boolean))];
        const requestedSupported = !requestedPixelFormat || detectedPixelFormats.includes(requestedPixelFormat) || modes.some((mode) => mode.pixelFormat === requestedPixelFormat);
        let selectedPixelFormat = requestedPixelFormat;
        if (!selectedPixelFormat || !requestedSupported || applyRecommended) {
          selectedPixelFormat = recommended.pixelFormat || (!requestedVideoCodec ? detectedPixelFormats[0] : '') || selectedPixelFormat;
        }
        setPixelFormatValue(selectedPixelFormat);
        if (cameraPlatform && cameraPlatform !== 'windows') $('videoCodec').value = '';
        setDatalist('videoCodecOptions', codecs);

        const probedPixelFormat = query.get('pixelFormat') || '';
        if (allowRetry && selectedPixelFormat && selectedPixelFormat !== probedPixelFormat && modes.length === 0) {
          return await loadCameraCapabilities(true, true, false);
        }

        cameraModes = modes;
        if (applyRecommended || !requestedPixelFormat || !requestedSupported) {
          const recommendedMode = recommended.width ? recommended : cameraModes.find((mode) => mode.pixelFormat === selectedPixelFormat || mode.videoCodec === requestedVideoCodec);
          applyCameraMode(recommendedMode);
        }
        renderCameraModes();
        updateModeDatalists();
        syncCameraModeSelection();
        if (data.drawtextAvailable === false) {
          setCapabilityMeta(t('watermarkUnavailable'), 'warning');
        } else {
          setCapabilityMeta(t('capabilitiesDetected', {formatCount: formats.length, codecCount: codecs.length, modeCount: modes.length}));
        }
      } catch (error) {
        if (request !== capabilityRequest) return;
        setCapabilityMeta(t('capabilityDetectionFailed', {message: error.message}), 'error');
      } finally {
        if (request === capabilityRequest) {
          capabilitiesLoading = false;
          updateDeviceState();
        }
      }
    }

    async function loadCameras(applyRecommended = false) {
      const select = $('device');
      const selectedID = select.value || (config && config.capture.device) || '';
      camerasLoading = true;
      updateDeviceState();
      select.replaceChildren(new Option(t('detectingCameras'), ''));
      try {
        const payload = await api('/api/v1/cameras');
        const devices = Array.isArray(payload.data) ? payload.data : [];
        select.replaceChildren();
        for (const device of devices) {
          const option = new Option(device.name || device.id, device.id);
          option.title = device.id;
          select.add(option);
        }
        const selectedAvailable = devices.some((device) => device.id === selectedID);
        if (selectedID && !selectedAvailable) {
          const option = new Option(t('unavailableCamera', {name: selectedID}), selectedID);
          option.title = selectedID;
          select.add(option);
        }
        if (select.options.length === 0) select.add(new Option(t('noCameras'), ''));
        select.value = selectedID && Array.from(select.options).some((option) => option.value === selectedID) ? selectedID : '';
      } catch (error) {
        select.replaceChildren();
        if (selectedID) select.add(new Option(t('unavailableCamera', {name: selectedID}), selectedID));
        else select.add(new Option(t('noCameras'), ''));
        select.value = selectedID;
        showNotice(t('cameraDetectionFailed', {message: error.message}), 'error');
      } finally {
        camerasLoading = false;
        updateDeviceState();
      }
      await loadCameraCapabilities(applyRecommended, !applyRecommended);
    }

    async function loadStatus() {
      try {
        const payload = await api('/api/v1/status');
        const data = payload.data;
        currentState = data.state || 'reconnecting';
        currentRecordingState = (data.recording && data.recording.state) || 'previewing';
        $('serviceDot').classList.add('online');
        $('serviceText').textContent = t('online');
        const stateMessages = {deviceUnavailable: 'deviceUnavailable', reconnecting: 'reconnecting', previewing: 'livePreviewState', recording: 'recordingState', timedOut: 'timedOutState'};
        $('captureState').textContent = t(stateMessages[currentState] || 'deviceUnavailable');
        $('capturedDuration').textContent = friendlyDuration(data.buffer.durationMillis || 0);
        $('bufferFrames').textContent = data.buffer.frames.toLocaleString(language === 'zh' ? 'zh-CN' : 'en-US');
        $('bufferBytes').textContent = bytes(data.buffer.memoryBytes || 0);
        $('viewers').textContent = data.previewClients.toLocaleString(language === 'zh' ? 'zh-CN' : 'en-US');
        const transcode = (data.recording && data.recording.transcode) || {state: 'disabled'};
        const transcodeMessages = {disabled: 'transcodeDisabled', starting: 'transcodeStarting', running: 'transcodeRunning', finalizing: 'transcodeFinalizing', completed: 'transcodeCompleted', fallback: 'transcodeFallback'};
        $('transcodeState').textContent = t(transcodeMessages[transcode.state] || 'transcodeDisabled', {encoder: transcode.encoder || 'H.264', speed: Number(transcode.speed || 0).toFixed(2)});
        $('transcodeState').title = transcode.lastError || '';
        $('resetCaptureButton').disabled = currentState === 'deviceUnavailable' || currentState === 'reconnecting';
        $('exportButton').disabled = currentRecordingState !== 'recording';
        if (data.capture.lastError) showNotice(data.capture.lastError, 'error');
        if (data.recording && data.recording.lastError) showNotice(data.recording.lastError, 'error');
        if (data.capture.warning && data.capture.warning !== lastCaptureWarning) {
          lastCaptureWarning = data.capture.warning;
          if (data.capture.warning === 'watermarkUnavailable') showNotice(t('watermarkUnavailable'), 'warning');
        }
      } catch (error) {
        $('serviceDot').classList.remove('online');
        $('serviceText').textContent = t('offline');
      }
    }

    async function resetCapture() {
      if (currentRecordingState === 'recording' && !window.confirm(t('replaceRecordingConfirm'))) return;
      const button = $('resetCaptureButton');
      button.disabled = true;
      try {
        await api('/api/v1/capture/reset', {method: 'POST'});
        currentRecordingState = 'recording';
        currentState = 'recording';
        $('capturedDuration').textContent = friendlyDuration(0);
        $('bufferFrames').textContent = '0';
        $('bufferBytes').textContent = bytes(0);
        $('captureState').textContent = t('recordingState');
        $('exportButton').disabled = false;
        showNotice(t('captureReset'), 'success');
        await loadStatus();
      } catch (error) {
        showNotice(t('captureResetFailed', {message: error.message}), 'error');
      } finally {
        button.disabled = currentState === 'deviceUnavailable' || currentState === 'reconnecting';
      }
    }

    async function selectStorageDirectory() {
      const button = $('selectDirectoryButton');
      button.disabled = true;
      try {
        const payload = await api('/api/v1/storage/directory/select', {method: 'POST'});
        if (payload.data && payload.data.directory) $('directory').value = payload.data.directory;
      } catch (error) {
        showNotice(t('directorySelectionFailed', {message: error.message}), 'error');
      } finally {
        button.disabled = false;
      }
    }

    function updateDeviceState() {
      const camera = $('source').value === 'camera';
      $('device').disabled = !camera || camerasLoading;
      $('device').required = camera;
      $('cameraMode').disabled = !camera || camerasLoading || capabilitiesLoading;
      $('refreshCamerasButton').disabled = !camera || camerasLoading;
      updateCameraInputFields();
    }

    function connectPreview() {
      clearTimeout(reconnectTimer);
      if (socket) socket.close();
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${protocol}//${location.host}/ws/live`);
      socket.binaryType = 'blob';
      socket.onopen = () => { $('previewMeta').textContent = t('live'); };
      socket.onmessage = async (event) => {
        try {
          const bitmap = await createImageBitmap(event.data);
          if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
            canvas.width = bitmap.width;
            canvas.height = bitmap.height;
          }
          context.drawImage(bitmap, 0, 0);
          $('previewEmpty').hidden = true;
          $('previewMeta').textContent = `${bitmap.width} × ${bitmap.height}`;
          bitmap.close();
        } catch (_) {}
      };
      socket.onclose = () => {
        $('previewMeta').textContent = t('previewReconnecting');
        reconnectTimer = setTimeout(connectPreview, 1500);
      };
    }

    $('source').addEventListener('change', () => {
      updateDeviceState();
      loadCameraCapabilities(true, false);
    });
    $('device').addEventListener('change', () => loadCameraCapabilities(true, false));
    $('cameraMode').addEventListener('change', (event) => {
      if (event.target.value === '') return;
      applyCameraMode(cameraModes[Number(event.target.value)]);
      updateModeDatalists();
      syncCameraModeSelection();
    });
    $('pixelFormatSelect').addEventListener('change', () => {
      const manual = $('pixelFormatSelect').value === '__manual__';
      $('pixelFormat').hidden = !manual;
      $('pixelFormat').disabled = !manual;
      if (manual) {
        $('pixelFormat').focus();
        return;
      }
      if (pixelFormatValue()) $('videoCodec').value = '';
      loadCameraCapabilities($('pixelFormatSelect').value === '', true);
    });
    $('pixelFormat').addEventListener('change', () => {
      if ($('pixelFormat').value.trim()) $('videoCodec').value = '';
      loadCameraCapabilities(false, true);
    });
    $('videoCodec').addEventListener('change', () => {
      if ($('videoCodec').value.trim()) setPixelFormatValue('');
      loadCameraCapabilities(false, true);
    });
    for (const id of ['width', 'height', 'fps']) $(id).addEventListener('input', syncCameraModeSelection);
    $('refreshCamerasButton').addEventListener('click', () => loadCameras(false));
    $('selectDirectoryButton').addEventListener('click', selectStorageDirectory);
    $('resetCaptureButton').addEventListener('click', resetCapture);
    $('resetConfigButton').addEventListener('click', resetConfig);
    $('languageSelect').addEventListener('change', (event) => {
      applyLanguage(event.target.value, true);
      loadStatus();
      loadCameras(false);
    });
    $('refreshButton').addEventListener('click', loadStatus);
    $('configForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      if ($('source').value === 'camera' && !$('device').value) {
        showNotice(t('missingCamera'), 'error');
        return;
      }
      const pixelFormat = pixelFormatValue();
      const videoCodec = $('videoCodec').value.trim();
      if ($('source').value === 'camera' && Boolean(pixelFormat) === Boolean(videoCodec)) {
        showNotice(t('missingInputFormat'), 'error');
        return;
      }
      setConfigButtonsDisabled(true);
      const next = structuredClone(config);
      const previousPort = configuredPort(config.server.address);
      next.capture.source = $('source').value;
      next.capture.device = $('device').value;
      next.capture.pixelFormat = pixelFormat;
      next.capture.videoCodec = videoCodec;
      next.capture.width = Number($('width').value);
      next.capture.height = Number($('height').value);
      next.capture.fps = Number($('fps').value);
      next.capture.bufferSeconds = Number($('bufferSeconds').value);
      next.capture.jpegQuality = Number($('jpegQuality').value);
      next.recording.maxDurationMinutes = Number($('maxRecordingMinutes').value);
      next.export.transcodeDuringRecording = $('transcodeDuringRecording').checked;
      next.export.encoder = $('exportEncoder').value;
      next.export.softwareThreads = Number($('softwareThreads').value);
      next.server.address = addressWithPort(config.server.address, Number($('serverPort').value));
      next.storage.directory = $('directory').value.trim();
      next.storage.organization = $('storageOrganization').value;
      next.server.allowedOrigins = $('allowedOrigins').value.split(',').map((item) => item.trim()).filter(Boolean);
      try {
        const payload = await api('/api/v1/config', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(next)});
        config = payload.data;
        showNotice(previousPort === configuredPort(config.server.address) ? t('configSaved') : t('configSavedRestart'), 'success');
      } catch (error) {
        showNotice(error.message, 'error');
      } finally {
        setConfigButtonsDisabled(false);
      }
    });

    $('exportButton').addEventListener('click', async () => {
      const name = $('fileName').value.trim();
      if (!name) { showNotice(t('missingFileName'), 'error'); return; }
      const button = $('exportButton');
      button.disabled = true;
      try {
        const payload = await api(`/api/v1/record/save?fileName=${encodeURIComponent(name)}`, {method: 'POST'});
        currentRecordingState = 'previewing';
        currentState = 'previewing';
        $('capturedDuration').textContent = friendlyDuration(0);
        $('bufferFrames').textContent = '0';
        $('bufferBytes').textContent = bytes(0);
        $('captureState').textContent = t('livePreviewState');
        showNotice(t('taskAccepted', {fileName: payload.data.fileName}), 'success');
        pollJob(payload.data.jobId);
      } catch (error) {
        showNotice(error.message, 'error');
      } finally {
        button.disabled = currentRecordingState !== 'recording';
      }
    });

    async function pollJob(id) {
      try {
        const payload = await api(`/api/v1/record/jobs/${encodeURIComponent(id)}`);
        const job = payload.data;
        if (job.state === 'completed') { showNotice(t('exportComplete', {fileName: job.fileName}), 'success'); return; }
        if (job.state === 'failed') { showNotice(job.error || t('exportFailed'), 'error'); return; }
        showNotice(t('exportProgress', {fileName: job.fileName, frameCount: job.frameCount}));
        setTimeout(() => pollJob(id), 800);
      } catch (error) { showNotice(error.message, 'error'); }
    }

    Promise.all([loadConfig(), loadStatus()]).catch((error) => showNotice(error.message, 'error'));
    connectPreview();
    setInterval(loadStatus, 3000);
  </script>
</body>
</html>
