<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Recorder Console</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111315;
      color: #e8eaed;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: #111315; }
    button, input, select { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    header {
      height: 58px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; border-bottom: 1px solid #303439; background: #17191c;
    }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 650; }
    .mark { width: 24px; height: 18px; border: 2px solid #e8eaed; border-radius: 4px; position: relative; }
    .mark::after { content: ""; position: absolute; right: -7px; top: 4px; border: 4px solid transparent; border-right: 0; border-left: 6px solid #e8eaed; }
    .header-actions { display: flex; align-items: center; gap: 16px; }
    .language-select { width: auto; min-width: 92px; height: 32px; margin: 0; padding: 0 28px 0 9px; font-size: 12px; }
    .service-state { display: flex; align-items: center; gap: 8px; color: #aeb4bc; font-size: 13px; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d45252; }
    .dot.online { background: #42b883; box-shadow: 0 0 0 3px rgb(66 184 131 / 14%); }
    main { width: min(1240px, 100%); margin: 0 auto; padding: 22px 24px 32px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: 0; }
    .toolbar-actions { display: flex; gap: 8px; }
    button { min-height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid #42474e; background: #24272b; color: #f1f3f4; }
    button:hover { background: #2c3035; }
    button.primary { border-color: #267c5a; background: #267c5a; }
    button.primary:hover { background: #2d9169; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, .75fr); align-items: stretch; gap: 16px; }
    .panel { border: 1px solid #303439; border-radius: 8px; background: #191c1f; overflow: hidden; }
    .preview-panel { display: flex; flex-direction: column; }
    .panel-title { min-height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #303439; }
    .panel-title h2 { margin: 0; font-size: 14px; font-weight: 620; letter-spacing: 0; }
    .muted { color: #9299a2; font-size: 12px; }
    .preview { position: relative; flex: 1 1 auto; width: 100%; min-height: 0; aspect-ratio: 16 / 9; background: #090a0b; }
    canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
    .empty { position: absolute; inset: 0; display: grid; place-items: center; color: #7f8790; font-size: 13px; pointer-events: none; }
    .empty[hidden] { display: none; }
    .metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #303439; }
    .metric { min-width: 0; padding: 12px 14px; border-right: 1px solid #303439; }
    .metric:last-child { border-right: 0; }
    .metric-label { color: #8f969f; font-size: 11px; margin-bottom: 4px; }
    .metric-value { font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .metric-value-row { display: flex; align-items: center; justify-content: space-between; gap: 7px; }
    .metric-value-row .metric-value { min-width: 0; }
    .reset-capture { min-height: 27px; padding: 0 7px; font-size: 11px; white-space: nowrap; }
    form { padding: 15px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label, .field { display: block; min-width: 0; color: #aeb4bc; font-size: 12px; }
    label.wide, .field.wide { grid-column: 1 / -1; }
    input, select { width: 100%; height: 36px; margin-top: 6px; padding: 0 10px; border: 1px solid #3b4046; border-radius: 5px; outline: 0; background: #121416; color: #eef0f2; }
    input:focus, select:focus { border-color: #4f86c6; box-shadow: 0 0 0 2px rgb(79 134 198 / 15%); }
    .control-with-action { display: grid; grid-template-columns: minmax(0, 1fr) 36px; gap: 7px; margin-top: 6px; }
    .control-with-action input, .control-with-action select { margin-top: 0; }
    input[readonly] { color: #c8cdd3; cursor: default; }
    .icon-button { width: 36px; min-height: 36px; padding: 0; font-size: 20px; line-height: 1; }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
    .export-band { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 16px; padding: 15px; border: 1px solid #303439; border-radius: 8px; background: #191c1f; }
    .export-band input { margin: 0; }
    .notice { min-height: 20px; grid-column: 1 / -1; color: #9ca3ab; font-size: 12px; }
    .notice.error { color: #ef8585; }
    .notice.success { color: #65c99b; }
    @media (max-width: 820px) {
      header { padding: 0 16px; }
      main { padding: 18px 16px 26px; }
      .layout { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: 1fr 1fr; }
      .metric { border-bottom: 1px solid #303439; }
      .metric:nth-child(even) { border-right: 0; }
      .metric:last-child { grid-column: 1 / -1; border-bottom: 0; }
    }
    @media (max-width: 520px) {
      .header-actions { gap: 9px; }
      .language-select { min-width: 82px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .fields { grid-template-columns: 1fr; }
      label.wide, .field.wide { grid-column: auto; }
      .metrics { grid-template-columns: 1fr; }
      .metric, .metric:nth-child(even) { border-right: 0; }
      .metric:last-child { grid-column: auto; }
      .export-band { grid-template-columns: 1fr; }
      .export-band button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true"></span><span>Video Recorder</span></div>
    <div class="header-actions">
      <select id="languageSelect" class="language-select" aria-label="界面语言" data-i18n-aria="languageLabel">
        <option value="auto" data-i18n="languageAuto">自动</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
      <div class="service-state"><span id="serviceDot" class="dot"></span><span id="serviceText" data-i18n="connecting">正在连接</span></div>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <h1 data-i18n="consoleTitle">采集控制台</h1>
      <div class="toolbar-actions"><button id="refreshButton" type="button" data-i18n="refreshStatus">刷新状态</button></div>
    </div>
    <div class="layout">
      <section class="panel preview-panel">
        <div class="panel-title"><h2 data-i18n="livePreview">实时预览</h2><span id="previewMeta" class="muted" data-i18n="waitingStream">等待视频流</span></div>
        <div class="preview">
          <canvas id="previewCanvas"></canvas>
          <div id="previewEmpty" class="empty" data-i18n="noFrame">暂无画面</div>
        </div>
        <div class="metrics">
          <div class="metric"><div class="metric-label" data-i18n="captureStatus">采集状态</div><div class="metric-value-row"><div id="captureState" class="metric-value">--</div><button id="resetCaptureButton" class="reset-capture" type="button" data-i18n="resetCapture">重新采集</button></div></div>
          <div class="metric"><div class="metric-label" data-i18n="capturedDuration">已采集时间</div><div id="capturedDuration" class="metric-value">--</div></div>
          <div class="metric"><div class="metric-label" data-i18n="bufferedFrames">缓冲帧数</div><div id="bufferFrames" class="metric-value">--</div></div>
          <div class="metric"><div class="metric-label" data-i18n="memoryUsage">内存占用</div><div id="bufferBytes" class="metric-value">--</div></div>
          <div class="metric"><div class="metric-label" data-i18n="previewConnections">预览连接</div><div id="viewers" class="metric-value">--</div></div>
        </div>
      </section>
      <section class="panel">
        <div class="panel-title"><h2 data-i18n="captureConfig">采集配置</h2><span class="muted" data-i18n="configRestartHint">保存后自动重启采集</span></div>
        <form id="configForm">
          <div class="fields">
            <label><span data-i18n="videoSource">视频源</span><select id="source"><option value="mock" data-i18n="mockSource">测试画面</option><option value="camera" data-i18n="cameraSource">摄像头</option></select></label>
            <label><span data-i18n="frameRate">帧率</span><input id="fps" type="number" min="1" max="120" required></label>
            <div class="field wide">
              <label for="device" data-i18n="cameraDevice">摄像头设备</label>
              <div class="control-with-action">
                <select id="device"><option value="" data-i18n="detectingCameras">正在检测摄像头</option></select>
                <button id="refreshCamerasButton" class="icon-button" type="button" title="重新检测摄像头" aria-label="重新检测摄像头" data-i18n-title="refreshCameras" data-i18n-aria="refreshCameras">↻</button>
              </div>
            </div>
            <label><span data-i18n="serverPort">服务端口</span><input id="serverPort" type="number" min="1" max="65535" required></label>
            <label><span data-i18n="storageOrganization">文件分类</span><select id="storageOrganization"><option value="day" data-i18n="organizationDay">按天</option><option value="month" data-i18n="organizationMonth">按月</option><option value="none" data-i18n="organizationNone">无</option></select></label>
            <label><span data-i18n="width">宽度</span><input id="width" type="number" min="160" max="7680" required></label>
            <label><span data-i18n="height">高度</span><input id="height" type="number" min="120" max="4320" required></label>
            <label><span data-i18n="bufferDuration">缓冲时长（秒）</span><input id="bufferSeconds" type="number" min="1" max="3600" required></label>
            <label><span data-i18n="jpegQuality">JPEG 质量（2 最佳）</span><input id="jpegQuality" type="number" min="2" max="31" required></label>
            <div class="field wide">
              <label for="directory" data-i18n="storageDirectory">视频存储目录</label>
              <div class="control-with-action">
                <input id="directory" type="text" readonly required>
                <button id="selectDirectoryButton" class="icon-button" type="button" title="选择视频存储目录" aria-label="选择视频存储目录" data-i18n-title="selectDirectory" data-i18n-aria="selectDirectory">📁</button>
              </div>
            </div>
            <label class="wide"><span data-i18n="allowedOrigins">允许的 Web 应用 Origin</span><input id="allowedOrigins" type="text" placeholder="例如 https://app.example.com，多个地址用逗号分隔" data-i18n-placeholder="originsPlaceholder"></label>
          </div>
          <div class="form-actions"><button id="resetConfigButton" type="button" data-i18n="resetConfig">重置配置</button><button id="saveConfigButton" class="primary" type="submit" data-i18n="saveConfig">保存配置</button></div>
        </form>
      </section>
    </div>
    <section class="export-band">
      <input id="fileName" type="text" maxlength="128" placeholder="导出文件名，例如 task_20260728_001" aria-label="导出文件名" data-i18n-placeholder="filePlaceholder" data-i18n-aria="fileLabel">
      <button id="exportButton" class="primary" type="button" data-i18n="exportBuffer">保存并重新采集</button>
      <div id="notice" class="notice"></div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const messages = {
      zh: {
        pageTitle: 'Video Recorder 控制台', languageLabel: '界面语言', languageAuto: '自动', connecting: '正在连接', consoleTitle: '采集控制台',
        refreshStatus: '刷新状态', livePreview: '实时预览', waitingStream: '等待视频流', noFrame: '暂无画面',
        captureStatus: '采集状态', capturedDuration: '已采集时间', resetCapture: '重新采集', bufferedFrames: '缓冲帧数', memoryUsage: '内存占用', previewConnections: '预览连接',
        captureConfig: '采集配置', configRestartHint: '保存后自动重启采集', videoSource: '视频源', mockSource: '测试画面',
        cameraSource: '摄像头', frameRate: '帧率', serverPort: '服务端口', storageOrganization: '文件分类', organizationDay: '按天', organizationMonth: '按月', organizationNone: '无', cameraDevice: '摄像头设备', refreshCameras: '重新检测摄像头',
        detectingCameras: '正在检测摄像头', noCameras: '未检测到摄像头', unavailableCamera: '{name}（当前不可用）', width: '宽度', height: '高度',
        bufferDuration: '缓冲时长（秒）', jpegQuality: 'JPEG 质量（2 最佳）', storageDirectory: '视频存储目录', selectDirectory: '选择视频存储目录',
        allowedOrigins: '允许的 Web 应用 Origin', originsPlaceholder: '例如 https://app.example.com，多个地址用逗号分隔',
        resetConfig: '重置配置', saveConfig: '保存配置', filePlaceholder: '导出文件名，例如 task_20260728_001', fileLabel: '导出文件名',
        exportBuffer: '保存并重新采集', requestFailed: '请求失败', online: '服务在线', offline: '服务离线',
        capturing: '采集中', reconnecting: '重连中', live: '实时', previewReconnecting: '正在重连',
        configSaved: '配置已保存，采集进程正在重新连接。', configSavedRestart: '配置已保存；端口将在重启应用后生效。', missingFileName: '请输入导出文件名。', missingCamera: '请选择一个明确的摄像头设备。',
        resetCaptureConfirm: '将清空当前已采集的视频并重新开始，是否继续？', captureReset: '已清空当前视频并重新开始采集。', captureResetFailed: '重新采集失败：{message}',
        resetConfigConfirm: '将帧率、宽度、高度、缓冲时长和 JPEG 质量恢复为默认值，是否继续？', configReset: '采集参数已恢复为默认值。', configResetFailed: '重置配置失败：{message}',
        cameraDetectionFailed: '摄像头检测失败：{message}', directorySelectionFailed: '目录选择失败：{message}',
        taskAccepted: '已开始保存并重新采集：{fileName}', exportComplete: '保存完成：{fileName}', exportFailed: '保存失败',
        exportProgress: '正在保存 {fileName}（{frameCount} 帧）'
      },
      en: {
        pageTitle: 'Video Recorder Console', languageLabel: 'Interface language', languageAuto: 'Auto', connecting: 'Connecting', consoleTitle: 'Capture Console',
        refreshStatus: 'Refresh status', livePreview: 'Live Preview', waitingStream: 'Waiting for video stream', noFrame: 'No video frame',
        captureStatus: 'Capture status', capturedDuration: 'Captured duration', resetCapture: 'Start over', bufferedFrames: 'Buffered frames', memoryUsage: 'Memory usage', previewConnections: 'Preview clients',
        captureConfig: 'Capture Settings', configRestartHint: 'Capture restarts after saving', videoSource: 'Video source', mockSource: 'Test pattern',
        cameraSource: 'Camera', frameRate: 'Frame rate', serverPort: 'Service port', storageOrganization: 'File organization', organizationDay: 'By day', organizationMonth: 'By month', organizationNone: 'None', cameraDevice: 'Camera device', refreshCameras: 'Detect cameras again',
        detectingCameras: 'Detecting cameras', noCameras: 'No cameras detected', unavailableCamera: '{name} (currently unavailable)', width: 'Width', height: 'Height',
        bufferDuration: 'Buffer duration (seconds)', jpegQuality: 'JPEG quality (2 is best)', storageDirectory: 'Video storage directory', selectDirectory: 'Select video storage directory',
        allowedOrigins: 'Allowed web application origins', originsPlaceholder: 'For example https://app.example.com; separate multiple origins with commas',
        resetConfig: 'Reset settings', saveConfig: 'Save settings', filePlaceholder: 'Export file name, for example task_20260728_001', fileLabel: 'Export file name',
        exportBuffer: 'Save and start over', requestFailed: 'Request failed', online: 'Service online', offline: 'Service offline',
        capturing: 'Capturing', reconnecting: 'Reconnecting', live: 'Live', previewReconnecting: 'Reconnecting',
        configSaved: 'Settings saved. The capture process is reconnecting.', configSavedRestart: 'Settings saved. The port takes effect after restarting the application.', missingFileName: 'Enter an export file name.', missingCamera: 'Select a specific camera device.',
        resetCaptureConfirm: 'Clear the currently captured video and start over?', captureReset: 'The current video was cleared and capture restarted.', captureResetFailed: 'Could not restart capture: {message}',
        resetConfigConfirm: 'Restore frame rate, width, height, buffer duration, and JPEG quality to their defaults?', configReset: 'Capture settings restored to their defaults.', configResetFailed: 'Could not reset settings: {message}',
        cameraDetectionFailed: 'Camera detection failed: {message}', directorySelectionFailed: 'Directory selection failed: {message}',
        taskAccepted: 'Saving and capture restarted: {fileName}', exportComplete: 'Save completed: {fileName}', exportFailed: 'Save failed',
        exportProgress: 'Saving {fileName} ({frameCount} frames)'
      }
    };

    function detectedLanguage() {
      const preferred = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
      return preferred.toLowerCase().startsWith('zh') ? 'zh' : 'en';
    }

    function storedLanguagePreference() {
      try {
        const stored = localStorage.getItem('videoRecorderLanguage');
        return stored === 'zh' || stored === 'en' ? stored : 'auto';
      } catch (_) {
        return 'auto';
      }
    }

    let languagePreference = storedLanguagePreference();
    let language = languagePreference === 'auto' ? detectedLanguage() : languagePreference;

    function t(key, values = {}) {
      const template = messages[language][key] || messages.en[key] || key;
      return template.replace(/\{(\w+)\}/g, (_, name) => values[name] ?? `{${name}}`);
    }

    function applyLanguage(preference, persist = false) {
      languagePreference = preference === 'zh' || preference === 'en' ? preference : 'auto';
      language = languagePreference === 'auto' ? detectedLanguage() : languagePreference;
      document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
      document.title = t('pageTitle');
      document.querySelectorAll('[data-i18n]').forEach((element) => {
        element.textContent = t(element.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach((element) => {
        element.placeholder = t(element.dataset.i18nPlaceholder);
      });
      document.querySelectorAll('[data-i18n-aria]').forEach((element) => {
        element.setAttribute('aria-label', t(element.dataset.i18nAria));
      });
      document.querySelectorAll('[data-i18n-title]').forEach((element) => {
        element.title = t(element.dataset.i18nTitle);
      });
      $('languageSelect').value = languagePreference;
      if (persist) {
        try {
          if (languagePreference === 'auto') localStorage.removeItem('videoRecorderLanguage');
          else localStorage.setItem('videoRecorderLanguage', languagePreference);
        } catch (_) {}
      }
    }

    applyLanguage(languagePreference);

    const canvas = $('previewCanvas');
    const context = canvas.getContext('2d');
    let config;
    let socket;
    let reconnectTimer;
    let camerasLoading = false;

    async function api(path, options = {}) {
      const response = await fetch(path, options);
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.message || t('requestFailed'));
      return payload;
    }

    function showNotice(message, type = '') {
      $('notice').textContent = message;
      $('notice').className = `notice ${type}`;
    }

    function bytes(value) {
      if (value < 1024) return `${value} B`;
      if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KB`;
      return `${(value / 1024 / 1024).toFixed(1)} MB`;
    }

    function friendlyDuration(milliseconds) {
      let seconds = Math.max(0, Math.floor(milliseconds / 1000));
      if (milliseconds > 0 && seconds === 0) return language === 'zh' ? '不足 1 秒' : 'Less than 1 sec';
      const days = Math.floor(seconds / 86400);
      seconds %= 86400;
      const hours = Math.floor(seconds / 3600);
      seconds %= 3600;
      const minutes = Math.floor(seconds / 60);
      seconds %= 60;
      if (language === 'zh') {
        if (days) return `${days}天 ${hours}小时 ${minutes}分`;
        if (hours) return `${hours}小时 ${minutes}分 ${seconds}秒`;
        if (minutes) return `${minutes}分 ${seconds}秒`;
        return `${seconds}秒`;
      }
      if (days) return `${days}d ${hours}h ${minutes}m`;
      if (hours) return `${hours}h ${minutes}m ${seconds}s`;
      if (minutes) return `${minutes}m ${seconds}s`;
      return `${seconds}s`;
    }

    function configuredPort(address) {
      const match = String(address).match(/:(\d+)$/);
      return match ? Number(match[1]) : 9000;
    }

    function addressWithPort(address, port) {
      return String(address).replace(/:\d+$/, `:${port}`);
    }

    async function loadConfig() {
      const payload = await api('/api/v1/config');
      config = payload.data;
      $('source').value = config.capture.source;
      $('width').value = config.capture.width;
      $('height').value = config.capture.height;
      $('fps').value = config.capture.fps;
      $('serverPort').value = configuredPort(config.server.address);
      $('bufferSeconds').value = config.capture.bufferSeconds;
      $('jpegQuality').value = config.capture.jpegQuality;
      $('directory').value = config.storage.directory;
      $('storageOrganization').value = config.storage.organization;
      $('allowedOrigins').value = config.server.allowedOrigins.join(', ');
      await loadCameras();
    }

    function setConfigButtonsDisabled(disabled) {
      $('saveConfigButton').disabled = disabled;
      $('resetConfigButton').disabled = disabled;
    }

    async function resetConfig() {
      if (!window.confirm(t('resetConfigConfirm'))) return;
      setConfigButtonsDisabled(true);
      try {
        const payload = await api('/api/v1/config/reset', {method: 'POST'});
        config = payload.data;
        await Promise.all([loadConfig(), loadStatus()]);
        showNotice(t('configReset'), 'success');
      } catch (error) {
        showNotice(t('configResetFailed', {message: error.message}), 'error');
      } finally {
        setConfigButtonsDisabled(false);
      }
    }

    async function loadCameras() {
      const select = $('device');
      const selectedID = select.value || (config && config.capture.device) || '';
      camerasLoading = true;
      updateDeviceState();
      select.replaceChildren(new Option(t('detectingCameras'), ''));
      try {
        const payload = await api('/api/v1/cameras');
        const devices = Array.isArray(payload.data) ? payload.data : [];
        select.replaceChildren();
        for (const device of devices) {
          const option = new Option(device.name || device.id, device.id);
          option.title = device.id;
          select.add(option);
        }
        const selectedAvailable = devices.some((device) => device.id === selectedID);
        if (selectedID && !selectedAvailable) {
          const option = new Option(t('unavailableCamera', {name: selectedID}), selectedID);
          option.title = selectedID;
          select.add(option);
        }
        if (select.options.length === 0) select.add(new Option(t('noCameras'), ''));
        select.value = selectedID && Array.from(select.options).some((option) => option.value === selectedID) ? selectedID : '';
      } catch (error) {
        select.replaceChildren();
        if (selectedID) select.add(new Option(t('unavailableCamera', {name: selectedID}), selectedID));
        else select.add(new Option(t('noCameras'), ''));
        select.value = selectedID;
        showNotice(t('cameraDetectionFailed', {message: error.message}), 'error');
      } finally {
        camerasLoading = false;
        updateDeviceState();
      }
    }

    async function loadStatus() {
      try {
        const payload = await api('/api/v1/status');
        const data = payload.data;
        $('serviceDot').classList.add('online');
        $('serviceText').textContent = t('online');
        $('captureState').textContent = data.capture.running ? t('capturing') : t('reconnecting');
        $('capturedDuration').textContent = friendlyDuration(data.buffer.durationMillis || 0);
        $('bufferFrames').textContent = data.buffer.frames.toLocaleString(language === 'zh' ? 'zh-CN' : 'en-US');
        $('bufferBytes').textContent = bytes(data.buffer.bytes);
        $('viewers').textContent = data.previewClients.toLocaleString(language === 'zh' ? 'zh-CN' : 'en-US');
        if (data.capture.lastError) showNotice(data.capture.lastError, 'error');
      } catch (error) {
        $('serviceDot').classList.remove('online');
        $('serviceText').textContent = t('offline');
      }
    }

    async function resetCapture() {
      if (!window.confirm(t('resetCaptureConfirm'))) return;
      const button = $('resetCaptureButton');
      button.disabled = true;
      try {
        await api('/api/v1/capture/reset', {method: 'POST'});
        context.clearRect(0, 0, canvas.width, canvas.height);
        $('previewEmpty').hidden = false;
        $('capturedDuration').textContent = friendlyDuration(0);
        $('bufferFrames').textContent = '0';
        $('bufferBytes').textContent = bytes(0);
        showNotice(t('captureReset'), 'success');
        await loadStatus();
      } catch (error) {
        showNotice(t('captureResetFailed', {message: error.message}), 'error');
      } finally {
        button.disabled = false;
      }
    }

    async function selectStorageDirectory() {
      const button = $('selectDirectoryButton');
      button.disabled = true;
      try {
        const payload = await api('/api/v1/storage/directory/select', {method: 'POST'});
        if (payload.data && payload.data.directory) $('directory').value = payload.data.directory;
      } catch (error) {
        showNotice(t('directorySelectionFailed', {message: error.message}), 'error');
      } finally {
        button.disabled = false;
      }
    }

    function updateDeviceState() {
      const camera = $('source').value === 'camera';
      $('device').disabled = !camera || camerasLoading;
      $('device').required = camera;
      $('refreshCamerasButton').disabled = !camera || camerasLoading;
    }

    function connectPreview() {
      clearTimeout(reconnectTimer);
      if (socket) socket.close();
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${protocol}//${location.host}/ws/live`);
      socket.binaryType = 'blob';
      socket.onopen = () => { $('previewMeta').textContent = t('live'); };
      socket.onmessage = async (event) => {
        try {
          const bitmap = await createImageBitmap(event.data);
          if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
            canvas.width = bitmap.width;
            canvas.height = bitmap.height;
          }
          context.drawImage(bitmap, 0, 0);
          $('previewEmpty').hidden = true;
          $('previewMeta').textContent = `${bitmap.width} × ${bitmap.height}`;
          bitmap.close();
        } catch (_) {}
      };
      socket.onclose = () => {
        $('previewMeta').textContent = t('previewReconnecting');
        reconnectTimer = setTimeout(connectPreview, 1500);
      };
    }

    $('source').addEventListener('change', updateDeviceState);
    $('refreshCamerasButton').addEventListener('click', loadCameras);
    $('selectDirectoryButton').addEventListener('click', selectStorageDirectory);
    $('resetCaptureButton').addEventListener('click', resetCapture);
    $('resetConfigButton').addEventListener('click', resetConfig);
    $('languageSelect').addEventListener('change', (event) => {
      applyLanguage(event.target.value, true);
      loadStatus();
      loadCameras();
    });
    $('refreshButton').addEventListener('click', loadStatus);
    $('configForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      if ($('source').value === 'camera' && !$('device').value) {
        showNotice(t('missingCamera'), 'error');
        return;
      }
      setConfigButtonsDisabled(true);
      const next = structuredClone(config);
      const previousPort = configuredPort(config.server.address);
      next.capture.source = $('source').value;
      next.capture.device = $('device').value;
      next.capture.width = Number($('width').value);
      next.capture.height = Number($('height').value);
      next.capture.fps = Number($('fps').value);
      next.capture.bufferSeconds = Number($('bufferSeconds').value);
      next.capture.jpegQuality = Number($('jpegQuality').value);
      next.server.address = addressWithPort(config.server.address, Number($('serverPort').value));
      next.storage.directory = $('directory').value.trim();
      next.storage.organization = $('storageOrganization').value;
      next.server.allowedOrigins = $('allowedOrigins').value.split(',').map((item) => item.trim()).filter(Boolean);
      try {
        const payload = await api('/api/v1/config', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(next)});
        config = payload.data;
        showNotice(previousPort === configuredPort(config.server.address) ? t('configSaved') : t('configSavedRestart'), 'success');
      } catch (error) {
        showNotice(error.message, 'error');
      } finally {
        setConfigButtonsDisabled(false);
      }
    });

    $('exportButton').addEventListener('click', async () => {
      const name = $('fileName').value.trim();
      if (!name) { showNotice(t('missingFileName'), 'error'); return; }
      const button = $('exportButton');
      button.disabled = true;
      try {
        const payload = await api(`/api/v1/record/save?fileName=${encodeURIComponent(name)}`, {method: 'POST'});
        context.clearRect(0, 0, canvas.width, canvas.height);
        $('previewEmpty').hidden = false;
        $('capturedDuration').textContent = friendlyDuration(0);
        $('bufferFrames').textContent = '0';
        $('bufferBytes').textContent = bytes(0);
        showNotice(t('taskAccepted', {fileName: payload.data.fileName}), 'success');
        pollJob(payload.data.jobId);
      } catch (error) {
        showNotice(error.message, 'error');
      } finally {
        button.disabled = false;
      }
    });

    async function pollJob(id) {
      try {
        const payload = await api(`/api/v1/record/jobs/${encodeURIComponent(id)}`);
        const job = payload.data;
        if (job.state === 'completed') { showNotice(t('exportComplete', {fileName: job.fileName}), 'success'); return; }
        if (job.state === 'failed') { showNotice(job.error || t('exportFailed'), 'error'); return; }
        showNotice(t('exportProgress', {fileName: job.fileName, frameCount: job.frameCount}));
        setTimeout(() => pollJob(id), 800);
      } catch (error) { showNotice(error.message, 'error'); }
    }

    Promise.all([loadConfig(), loadStatus()]).catch((error) => showNotice(error.message, 'error'));
    connectPreview();
    setInterval(loadStatus, 3000);
  </script>
</body>
</html>
